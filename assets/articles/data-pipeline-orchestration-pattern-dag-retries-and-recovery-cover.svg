<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-label="Data Pipeline Orchestration Pattern: DAG Scheduling, Retries, and Recovery">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051124" />
      <stop offset="100%" stop-color="#0d234d" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="60%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgGradient)" />

  
    <!-- Ambient glowing orbs -->
    <circle cx="1060" cy="180" r="140" fill="#60a5fa" fill-opacity="0.12" filter="blur(40px)" />
    <circle cx="920" cy="460" r="180" fill="#60a5fa" fill-opacity="0.08" filter="blur(60px)" />

    <!-- Technical background grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(96, 165, 250, 0.08)" stroke-width="1.2" />
    </pattern>
    <rect x="0" y="0" width="1200" height="675" fill="url(#grid)" />

    <!-- Isometric Wireframe Elements on Right -->
    <g transform="translate(860, 200)" stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.35">
      <!-- Outer Cube -->
      <polygon points="120,40 220,95 120,150 20,95" stroke-dasharray="4,4" />
      <polygon points="20,95 120,150 120,260 20,205" fill="#60a5fa" fill-opacity="0.05" />
      <polygon points="220,95 120,150 120,260 220,205" fill="#60a5fa" fill-opacity="0.1" />
      <polygon points="120,40 220,95 220,205 120,150" />
      <line x1="120" y1="150" x2="120" y2="260" stroke-width="2.5" />
      
      <!-- Internal Nodes -->
      <circle cx="120" cy="150" r="6" fill="#60a5fa" />
      <circle cx="20" cy="95" r="4" fill="#60a5fa" />
      <circle cx="220" cy="95" r="4" fill="#60a5fa" />
      <circle cx="120" cy="260" r="4" fill="#60a5fa" />
    </g>
  

  <!-- Header Branding Bar -->
  <g transform="translate(100, 105)">
    <!-- Brand Icon/Logo Mark -->
    <rect x="0" y="0" width="32" height="32" rx="8" fill="#60a5fa" fill-opacity="0.2" stroke="#60a5fa" stroke-width="1.5" />
    <polygon points="16,6 26,24 6,24" fill="#60a5fa" />
    
    <text x="44" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="3">ABSTRACT ALGORITHMS</text>
  </g>

  <!-- Category Badge -->
  <g transform="translate(100, 175)">
    <rect x="0" y="0" width="163.5" height="32" rx="16" fill="rgba(96, 165, 250, 0.15)" stroke="rgba(96, 165, 250, 0.4)" stroke-width="1.2" />
    <circle cx="18" cy="16" r="4" fill="#60a5fa" />
    <text x="32" y="21" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5">SYSTEM DESIGN</text>
  </g>

  <!-- Title Text -->
  <text fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
    <tspan x="100" y="290">Data Pipeline Orchestration</tspan>
      <tspan x="100" y="346">Pattern: DAG Scheduling, Retries,</tspan>
      <tspan x="100" y="402">and...</tspan>
  </text>

  <!-- Bottom Accent Line -->
  <rect x="100" y="555" width="280" height="4" rx="2" fill="url(#accentLine)" />

  <!-- Footer Metadata -->
  <g transform="translate(100, 595)">
    <text fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
      Canonical Article · System Architecture & Deep Dive
    </text>
  </g>
</svg>